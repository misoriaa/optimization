<!DOCTYPE html>
<html lang="ru"> <!-- ИСПРАВЛЕНИЕ 1: Добавлен атрибут lang="ru" (Критерий 3.1.1) -->
<head>
    <meta charset="UTF-8">
    <title>Приют Солнцево</title>
    <style>
        /* ИСПРАВЛЕНИЕ 2: Изменен цвет заголовка для соответствия контрасту 4.5:1 (Критерий 1.4.3) */
        /* Было: color: #f0f0f0; Стало: */
        .main-title {
            color: #000000; 
            background-color: #FABD00;
        }
        /* Класс для скрытия текста визуально, но оставления его для скринридеров */
        .visually-hidden {
            position: absolute; width: 1px; height: 1px; margin: -1px;
            padding: 0; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <!-- ИСПРАВЛЕНИЕ 3: Декоративной картинке добавлен пустой alt (Критерий 1.1.1) -->
            <img src="logo-dog.png" alt="">
            
            <ul>
                <li><a href="/home">Главная</a></li>
                <li><a href="/about">О приюте</a></li>
                <li><a href="/rules">Правила посещения</a></li>
            </ul>
            
            <!-- ИСПРАВЛЕНИЕ 4: Добавлен aria-label для пустой ссылки-иконки (Критерий 4.1.2) -->
            <a href="https://vk.com/priut" aria-label="Наша группа ВКонтакте">
                <img src="vk-icon.png" alt="">
            </a>
            
            <!-- ИСПРАВЛЕНИЕ 5: Добавлена метка label для поля поиска (Критерий 1.3.1) -->
            <form action="/search">
                <label for="search-input" class="visually-hidden">Поиск по сайту</label>
                <input type="text" id="search-input" placeholder="Поиск">
                <button type="submit">Найти</button>
            </form>
        </nav>
    </header>

    <main>
        <!-- ИСПРАВЛЕНИЕ 6: Заменен div на h1 (и добавлены h2 ниже), выстроена иерархия (Критерий 1.3.1) -->
        <h1 class="main-title">О нашем проекте</h1>
        
        <p>Приют Солнцево — это пристанище для 1500 бездомных собак...</p>
        
        <h2>Как помочь</h2>
        <a href="/help" class="btn">Как помочь</a>
    </main>
</body>
</html>
